zabbix_export:
  version: '6.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: fb97ff52580a451b991adbbdb33df89c
      template: 'PowerWalker NMC NG SNMP'
      name: 'PowerWalker NMC NG SNMP'
      description: 'Template for PowerWalker NMC Card NG (new generation) SNMP v1/2/3 protocol.'
      groups:
        - name: Templates
      items:
        - uuid: 65dba61d3bd343689b416dc8a0ecefea
          name: 'System Uptime'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: sysUpTime.0
          delay: 60m
          value_type: TEXT
          trends: '0'
          tags:
            - tag: Application
              value: General
        - uuid: a34e53189e9c4fdda3768792a515824c
          name: 'Battery Status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.2.1.0
          key: upsBatteryStatus.0
          tags:
            - tag: Application
              value: Battery
          triggers:
            - uuid: a0b1dc11d2f04785b2d4fe91efcf1e54
              expression: 'avg(/PowerWalker NMC NG SNMP/upsBatteryStatus.0,1m)<>2'
              name: 'UPS battery status is not normal'
              priority: HIGH
        - uuid: db3d3993ea104184b03892ab1f399995
          name: 'Battery charge Remaining (%)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.2.4.0
          key: upsEstimatedChargeRemaining
          tags:
            - tag: Application
              value: Battery
          triggers:
            - uuid: 12b6337f1d90416d9c6def606284b01b
              expression: 'avg(/PowerWalker NMC NG SNMP/upsEstimatedChargeRemaining,1m)<10'
              name: 'Battery charge is below 10%'
              priority: HIGH
            - uuid: 31710f7bb1a34a2c80677b9e3e6947a1
              expression: 'avg(/PowerWalker NMC NG SNMP/upsEstimatedChargeRemaining,1m)<25'
              name: 'Battery charge is below 25%'
              priority: AVERAGE
            - uuid: cfefcacc255143c2a7916601bd991a9d
              expression: 'avg(/PowerWalker NMC NG SNMP/upsEstimatedChargeRemaining,1m)<50'
              name: 'Battery charge is below 50%'
              priority: WARNING
            - uuid: 15fd0e58e07e459b9a200f9e618f9ae9
              expression: 'avg(/PowerWalker NMC NG SNMP/upsEstimatedChargeRemaining,1m)<75'
              name: 'Battery charge is below 75%'
              priority: INFO
        - uuid: f837a33e768648eb8cd1d3b2e7263246
          name: 'Estimated Minutes Remaining'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.2.3.0
          key: upsEstimatedMinutesRemaining
          units: m
          tags:
            - tag: Application
              value: Battery
          triggers:
            - uuid: 78c3f2d008e94ac2b9ccdf1a5251e68b
              expression: 'avg(/PowerWalker NMC NG SNMP/upsEstimatedMinutesRemaining,1m)<5'
              name: 'Low battery runtime (less than 5 minutes)'
              priority: DISASTER
        - uuid: 3f4fc872e03744d49d47389fa289bd6a
          name: 'Input Voltage'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.3.3.1.3.1
          key: upsInputVoltage
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 0b5c2a36fd4947e586d991fb43afe106
              expression: 'avg(/PowerWalker NMC NG SNMP/upsInputVoltage,1m)>265'
              name: 'Input Voltage is out of range'
              priority: AVERAGE
        - uuid: 6909738a03374840844c46167074e9ee
          name: 'Current Load (%)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.4.4.1.5.1
          key: upsOutputPercentLoad
          tags:
            - tag: Application
              value: Load
          triggers:
            - uuid: f122819f53cd463a801cbaefbf1f6f09
              expression: 'avg(/PowerWalker NMC NG SNMP/upsOutputPercentLoad,1m)>85'
              name: 'High Load (overload risk)'
              priority: INFO
        - uuid: 60262a6cdec74815909fad8603040917
          name: 'Current Power Source'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.4.1.0
          key: upsOutputSource
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 9733c059962d41de912732cacff5880f
              expression: 'avg(/PowerWalker NMC NG SNMP/upsOutputSource,1m)=5'
              name: 'UPS is running on battery'
              priority: WARNING
        - uuid: 65553b2d87ad4da58bfa9ce0dffc37bb
          name: 'Output Voltage'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.33.1.4.4.1.2.1
          key: upsOutputVoltage
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: cfb19ebfbb5e40a18f7f5a9254924601
              expression: 'change(/PowerWalker NMC NG SNMP/upsOutputVoltage)>10'
              name: 'Output Voltage Deviation (Stability Failure)'
              priority: HIGH
      macros:
        - macro: '{$SNMP_AUTHPASS}'
          type: SECRET_TEXT
        - macro: '{$SNMP_PORT}'
          value: '161'
        - macro: '{$SNMP_PRIVPASS}'
          type: SECRET_TEXT
        - macro: '{$SNMP_USERNAME}'
